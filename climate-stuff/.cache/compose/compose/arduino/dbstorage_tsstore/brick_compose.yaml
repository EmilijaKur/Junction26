services:
  dbstorage-influx:
    environment:
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      DOCKER_INFLUXDB_INIT_BUCKET: arduinostorage
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: arduino
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DB_PASSWORD}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DB_USERNAME}
    healthcheck:
      interval: 2s
      retries: 10
      test:
      - CMD-SHELL
      - curl -f http://localhost:8086/health || exit 1
      timeout: 3s
    image: influxdb:2.7-alpine
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    ports:
    - 127.0.0.1:8086:8086
    volumes:
    - ${APP_HOME:-.}/data/influx-data:/var/lib/influxdb2
